version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ledgerlens-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./ledgerlens.db:/app/ledgerlens.db
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ledgerlens-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - backend
