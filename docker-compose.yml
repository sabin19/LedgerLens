version: '3.8'

services:
  backend:
    build: .
    container_name: ledgerlens-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Mount local folders so data persists across container restarts
      - ./uploads:/app/uploads
      - ./ledgerlens.db:/app/ledgerlens.db
    env_file:
      - .env

  frontend:
    build: .
    container_name: ledgerlens-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - backend
